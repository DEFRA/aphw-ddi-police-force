environment: production
environmentCode:
name: aphw-ddi-police-force
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-police-force

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: aphw-ddi-police-force

containerSecret:
  name: aphw-ddi-police-force

deployment: {}

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 100Mi
  limitCpu: 100m
  port: 3000
  azureStorageUseConnectionString: false
  azureStorageAccountName: dummy
  azureStorageForceKmlContainer: aphw-ddi-policeforces
  azureStoragePostcodeCoordsContainer: aphw-ddi-postcodeareas
  osPlacesBaseUrl: https://api.os.uk/search/places/v1

livenessProbe:
  path: /healthz
  port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  path: /healthy
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
      - objectName: snd2-aphw-ddi-os-places-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-police-force
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
        - objectName: snd2-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
