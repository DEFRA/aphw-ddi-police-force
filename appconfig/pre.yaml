---
environment: production
environmentCode: pre
container:
  osPlacesBaseUrl: https://api.os.uk/search/places/v1
  azureStorageForceKmlContainer: aphw-ddi-policeforces
  azureStoragePostcodeCoordsContainer: aphw-ddi-postcodeareas
secretProviderClass:
  azure:
    keyvaultName: PREFFCINFKV1001
    objects:
      - objectName: pre-ffcahwr-appinsights-connectionString
        objectType: secret
      - objectName: PRE-aphw-ddi-os-places-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-police-force
      type: Opaque
      data:
        - objectName: pre-ffcahwr-appinsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
        - objectName: PRE-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
